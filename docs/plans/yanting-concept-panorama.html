<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>颜听 接待全景 示例</title>
<style>
:root {
  --plum-rail: #170f1d;
  --plum: #2a1f33;
  --plum-2: #3b2a4a;
  --gold: #d9b47c;
  --gold-ink: #8a6532;
  --gold-wash: #f7efe1;
  --gold-line: #e8d3b0;
  --porcelain: #f6f4f8;
  --desk: #f2f1f4;
  --card: #ffffff;
  --hair: #e8e3ed;
  --hair-2: #f0ecf3;
  --ink: #231a2b;
  --ink-2: #5e5468;
  --ink-3: #958ba1;
  --calm: #22906f;
  --upset: #d98a0f;
  --fury: #cc3550;
  --fury-wash: #fbe9ed;
  --upset-wash: #fcf1df;
  --sans: "Source Han Sans CN", "思源黑体 CN", "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --num: "Bahnschrift", "DIN Alternate", "Source Han Sans CN", sans-serif;
  --ease: cubic-bezier(.2,.8,.2,1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--desk); color: var(--ink); font: 400 14px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 76px 1fr; height: 100vh; }

/* rail */
.rail { background: var(--plum-rail); display: flex; flex-direction: column; align-items: center; padding: 18px 0; gap: 4px; }
.brand { display: grid; justify-items: center; gap: 6px; margin-bottom: 18px; }
.brand-mark { display: flex; align-items: center; gap: 2px; height: 22px; }
.brand-mark i { display: block; width: 3px; border-radius: 2px; background: var(--gold); }
.brand-name { font-weight: 800; font-size: 15px; letter-spacing: 0.12em; color: #f3eef6; }
.rail a { width: 60px; padding: 9px 0 7px; border-radius: 12px; display: grid; justify-items: center; gap: 3px; color: #8f839b; text-decoration: none; font-size: 11px; line-height: 1.2; position: relative; }
.rail a svg { width: 21px; height: 21px; }
.rail a:hover { color: #c3b8cc; background: rgba(255,255,255,0.04); }
.rail a.on { color: var(--gold); background: rgba(217,180,124,0.13); }
.rail a .dot { position: absolute; top: 5px; right: 13px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--fury); color: #fff; font: 600 10px/16px var(--num); }
.rail .gap { height: 14px; }

.shell { display: grid; grid-template-rows: 60px 1fr; min-width: 0; min-height: 0; }

/* top bar */
.top { display: flex; align-items: center; gap: 26px; padding: 0 20px 0 22px; background: var(--card); border-bottom: 1px solid var(--hair); }
.seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--desk); }
.seg button { border: 0; background: none; padding: 4px 14px; border-radius: 8px; font-size: 15px; font-weight: 600; color: var(--ink-3); }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(42,31,51,0.14); }
.stats { display: flex; gap: 24px; }
.stat { display: grid; line-height: 1.15; }
.stat span { font-size: 12px; color: var(--ink-3); }
.stat b { font: 600 19px/1.25 var(--num); }
.stat b.f { color: var(--fury); }
.top .sp { flex: 1; }
.live { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--hair); background: none; font-size: 13px; color: var(--ink-2); }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--calm); }
.live[aria-pressed="true"] i { animation: pulse 1.6s ease-in-out infinite; }
.live[aria-pressed="false"] i { background: var(--ink-3); }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px rgba(34,144,111,0.18); } }
.op { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border: 1px solid var(--hair); border-radius: 10px; font-size: 13px; color: var(--ink-2); background: none; }
.op .online { width: 7px; height: 7px; border-radius: 50%; background: var(--calm); }
.op svg { width: 14px; height: 14px; }

.pano { display: grid; grid-template-columns: minmax(0, 1fr) 384px; min-height: 0; }

/* wall */
.wall { overflow: auto; padding: 14px 16px 20px; }
.tools { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
.chips { display: inline-flex; gap: 4px; }
.chips button { border: 1px solid var(--hair); background: var(--card); padding: 2px 12px; border-radius: 999px; font-size: 13px; color: var(--ink-2); }
.chips button.on { background: var(--plum); border-color: var(--plum); color: #fff; }
.chips .n { font-family: var(--num); margin-left: 4px; }
.legend { display: flex; gap: 14px; margin-left: auto; font-size: 12px; color: var(--ink-2); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .sw-key { width: 8px; height: 13px; border-radius: 2px; }
.legend .wave-key { display: inline-flex; gap: 1.5px; align-items: center; height: 12px; }
.legend .wave-key i { width: 2px; border-radius: 1px; background: var(--gold-ink); }
.legend .dot-key { width: 8px; height: 8px; border-radius: 50%; background: var(--fury); }

.lanes { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.lane { background: var(--card); border: 1px solid var(--hair); border-radius: 14px; padding: 12px 14px 8px; min-width: 0; }
.lane[data-lane="ai"] { grid-column: 1 / -1; }
.lane.wait { background: linear-gradient(90deg, #fdf2f4, #ffffff 46%); border-color: #f1d3da; }
.lane-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
.lane-head b { font-size: 14px; }
.lane-head .n { font: 600 16px var(--num); }
.lane-head .sub { font-size: 12px; color: var(--ink-3); }
.lane-head .sub em { font-style: normal; font-family: var(--num); color: var(--ink-2); }
.tiles { display: flex; flex-wrap: wrap; gap: 4px 2px; min-height: 104px; align-content: flex-start; }

.tile { width: 72px; padding: 4px 3px 6px; border: 1px solid transparent; border-radius: 10px; background: none; display: grid; justify-items: center; gap: 2px; position: relative; }
.tile:hover { background: #faf8fb; }
.tile.sel { background: var(--gold-wash); border-color: var(--gold-line); }
.tile.dim { opacity: 0.22; }
.wave { display: flex; align-items: center; justify-content: center; gap: 2px; height: 12px; opacity: 0; transition: opacity .2s; }
.wave i { width: 2.5px; border-radius: 2px; background: var(--gold-ink); transform-origin: 50% 50%; }
.wave i:nth-child(1), .wave i:nth-child(5) { height: 4px; }
.wave i:nth-child(2), .wave i:nth-child(4) { height: 8px; }
.wave i:nth-child(3) { height: 11px; }
.wave.on { opacity: 1; }
.wave.on i { animation: talk .8s ease-in-out infinite alternate; }
.wave.on i:nth-child(2) { animation-delay: -.2s; }
.wave.on i:nth-child(3) { animation-delay: -.4s; }
.wave.on i:nth-child(4) { animation-delay: -.6s; }
.wave.on i:nth-child(5) { animation-delay: -.1s; }
@keyframes talk { from { transform: scaleY(.35); } to { transform: scaleY(1); } }
.sw-wrap { position: relative; width: 32px; height: 54px; margin-bottom: 3px; }
.sw-wrap::after { content: ""; position: absolute; left: -3px; right: -3px; bottom: -6px; height: 7px; background: radial-gradient(closest-side, rgba(42,31,51,0.16), transparent); }
.sw { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 1.5px; background: var(--card);
  clip-path: path('M0 7 L32 0 L32 49 Q32 54 27 54 L5 54 Q0 54 0 49 Z'); }
.tile.sel .sw { background: var(--gold-wash); }
.band { flex: none; display: block; transform-origin: 50% 100%; }
.rdot { position: absolute; right: -4px; top: -4px; width: 9px; height: 9px; border-radius: 50%; background: var(--fury); box-shadow: 0 0 0 2px var(--card); }
.nm { font-size: 12px; font-weight: 600; max-width: 60px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
.meta { font: 11px/1.2 var(--num); color: var(--ink-3); }
.meta.wait { color: var(--ink-2); }
.meta.warn { color: #a8670a; }
.meta.over { color: var(--fury); font-weight: 600; }

/* preview */
.preview { border-left: 1px solid var(--hair); background: var(--porcelain); overflow: auto; padding: 12px; display: grid; gap: 10px; align-content: start; grid-auto-rows: max-content; }
.card { background: var(--card); border: 1px solid var(--hair); border-radius: 14px; padding: 13px 14px; }
.card h3 { margin: 0 0 8px; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.card h3 .r { margin-left: auto; font-weight: 400; font-size: 12px; color: var(--ink-3); font-family: var(--num); }
.ph { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; }
.ph .sw-wrap { width: 40px; height: 66px; margin: 0; }
.ph .sw-wrap::after { display: none; }
.ph .sw { clip-path: path('M0 9 L40 0 L40 60 Q40 66 34 66 L6 66 Q0 66 0 60 Z'); gap: 2px; }
.ph b { font-size: 17px; display: flex; align-items: center; gap: 8px; }
.lane-chip { font-size: 12px; font-weight: 500; padding: 0 8px; border-radius: 6px; line-height: 20px; }
.lane-chip.ai { background: #efeaf5; color: var(--plum-2); }
.lane-chip.wait { background: var(--fury-wash); color: var(--fury); }
.lane-chip.human { background: #e7f4ef; color: var(--calm); }
.ph .sub { font-size: 12px; color: var(--ink-3); line-height: 1.5; }
.ph .now { display: flex; gap: 12px; font-size: 12px; color: var(--ink-2); margin-top: 3px; }
.ph .now span { display: inline-flex; align-items: center; gap: 5px; }
.ph .now i { width: 7px; height: 7px; border-radius: 50%; }
.ph .now .t { font-family: var(--num); }
.reason { border-left: 3px solid var(--fury); padding: 2px 0 2px 10px; }
.reason b { color: var(--fury); font-size: 13px; }
.reason q { display: block; font-size: 13px; color: var(--ink); margin-top: 2px; quotes: "“" "”"; }

.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.steps li { display: grid; grid-template-columns: 16px 1fr auto; gap: 8px; align-items: center; font-size: 13px; color: var(--ink-3); padding: 3px 0; position: relative; }
.steps li::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid #cfc6d8; justify-self: center; background: var(--card); z-index: 1; }
.steps li:not(:last-child)::after { content: ""; position: absolute; left: 7.5px; top: 18px; height: 12px; width: 1px; background: var(--hair); }
.steps li.done { color: var(--ink-2); }
.steps li.done::before { background: var(--calm); border-color: var(--calm); }
.steps li.active { color: var(--ink); font-weight: 600; }
.steps li.active::before { border-color: var(--gold-ink); background: var(--gold); animation: pulse2 1s ease-in-out infinite; }
@keyframes pulse2 { 50% { box-shadow: 0 0 0 4px rgba(217,180,124,0.3); } }
.steps li.fail { color: var(--fury); font-weight: 600; }
.steps li.fail::before { background: var(--fury); border-color: var(--fury); }
.steps .d { font: 12px var(--num); color: var(--ink-3); }

.msgs { display: grid; gap: 8px; }
.pm { display: grid; gap: 2px; max-width: 92%; }
.pm .who { font-size: 11px; color: var(--ink-3); display: flex; gap: 6px; align-items: center; }
.pm .who .t { font-family: var(--num); }
.pm .who .e { display: inline-flex; align-items: center; gap: 4px; }
.pm .who .e i { width: 6px; height: 6px; border-radius: 50%; }
.pm .bb { padding: 6px 10px; border-radius: 4px 12px 12px 12px; background: var(--card); border: 1px solid var(--hair); font-size: 13px; line-height: 1.6; }
.pm.c .bb { box-shadow: inset 3px 0 0 var(--lv); }
.pm.s { justify-self: end; }
.pm.s .who { justify-content: flex-end; }
.pm.s .bb { border-radius: 12px 4px 12px 12px; }
.pm.a .bb { background: var(--gold-wash); border-color: var(--gold-line); }
.pm.o .bb { background: #ece6f3; border-color: #e0d7ea; }
.pm.sys { justify-self: center; max-width: 100%; }
.pm.sys span { font-size: 11px; color: var(--ink-3); background: rgba(42,31,51,0.05); padding: 1px 10px; border-radius: 999px; }
.acts { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--hair-2); }
.b { height: 32px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--hair); background: var(--card); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.b.pri { background: var(--plum); border-color: var(--plum); color: #fff; font-weight: 600; }
.b.pri:hover { background: var(--plum-2); }
.b svg { width: 14px; height: 14px; }
.handler { font-size: 12px; color: var(--ink-2); align-self: center; }

@media (max-width: 1180px) {
  .pano { grid-template-columns: 1fr; overflow: auto; }
  .wall { overflow: visible; }
  .preview { border-left: 0; border-top: 1px solid var(--hair); }
  .stats { gap: 16px; }
  .stat:nth-child(n+5) { display: none; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: 56px 1fr; }
  .rail a { width: 48px; font-size: 10px; }
  .brand-name { font-size: 12px; }
  .top { gap: 12px; padding: 0 12px; overflow-x: auto; }
  .stats, .op { display: none; }
  .tools { flex-wrap: wrap; gap: 8px; }
  .legend { margin-left: 0; flex-wrap: wrap; gap: 10px; }
  .lanes { grid-template-columns: minmax(0, 1fr); }
  .wall { padding: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  .wave.on i, .live i, .steps li.active::before { animation: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="主导航">
    <div class="brand" aria-label="颜听">
      <div class="brand-mark" aria-hidden="true"><i style="height:8px"></i><i style="height:16px"></i><i style="height:22px"></i><i style="height:12px"></i><i style="height:6px"></i></div>
      <div class="brand-name">颜听</div>
    </div>
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>客户</a>
    <a href="#" class="on" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>接待</a>
    <a href="#"><span class="dot">6</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 12h3l2-5 3 10 3-7 2 2h5"/></svg>风险</a>
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>工单</a>
    <div class="gap"></div>
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M5 4h9a5 5 0 0 1 5 5v11H10a5 5 0 0 1-5-5z"/></svg>知识</a>
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 10l3 2-3 2M12 15h5"/></svg>Prompt</a>
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>模型</a>
  </nav>

  <div class="shell">
    <header class="top">
      <div class="seg" role="tablist" aria-label="接待视图">
        <button role="tab" aria-selected="false">工作台</button>
        <button role="tab" aria-selected="true" class="on">全景</button>
      </div>
      <div class="stats">
        <div class="stat"><span>AI 接待</span><b id="st-ai">96</b></div>
        <div class="stat"><span>自动回复率</span><b>61%</b></div>
        <div class="stat"><span>转人工</span><b id="st-ho">50</b></div>
        <div class="stat"><span>平均首响</span><b>12 秒</b></div>
        <div class="stat"><span>建议采纳率</span><b>58%</b></div>
        <div class="stat"><span>待处理风险</span><b class="f">73</b></div>
      </div>
      <div class="sp"></div>
      <button class="live" id="live" aria-pressed="true"><i></i><span>实时</span></button>
      <button class="op"><span class="online"></span>模拟客服 G001<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9l6 6 6-6"/></svg></button>
    </header>

    <div class="pano">
      <section class="wall" id="wall" aria-label="接待全景">
        <div class="tools">
          <div class="chips" role="group" aria-label="筛选" id="chips">
            <button class="on" data-f="all">全部</button>
            <button data-f="risk">有风险<span class="n" id="c-risk"></span></button>
            <button data-f="late">等待超时<span class="n" id="c-late"></span></button>
          </div>
          <div class="legend" aria-hidden="true">
            <span><i class="sw-key" style="background:var(--calm)"></i>平稳</span>
            <span><i class="sw-key" style="background:var(--upset)"></i>不满</span>
            <span><i class="sw-key" style="background:var(--fury)"></i>激烈</span>
            <span><i class="wave-key"><i style="height:4px"></i><i style="height:9px"></i><i style="height:12px"></i><i style="height:7px"></i></i>AI 处理中</span>
            <span><i class="dot-key"></i>高风险</span>
          </div>
        </div>
        <div class="lanes">
          <div class="lane wait" data-lane="wait"><div class="lane-head"><b>待人工</b><span class="n"></span><span class="sub"></span></div><div class="tiles"></div></div>
          <div class="lane" data-lane="human"><div class="lane-head"><b>人工处理中</b><span class="n"></span><span class="sub"></span></div><div class="tiles"></div></div>
          <div class="lane" data-lane="ai"><div class="lane-head"><b>AI 接待中</b><span class="n"></span><span class="sub"></span></div><div class="tiles"></div></div>
        </div>
      </section>
      <aside class="preview" id="preview" aria-label="会话预览" aria-live="polite"></aside>
    </div>
  </div>
</div>

const LV = ['平稳', '不满', '激烈'];
const COL = ['var(--calm)', 'var(--upset)', 'var(--fury)'];
const STEPS = [['安全检查', 200, 400], ['读取轨迹', 300, 700], ['知识检索', 500, 1200], ['起草', 1800, 3200], ['核验', 900, 1800], ['发送', 200, 300]];
const LANE = { ai: 'AI 接待中', wait: '待人工', human: '人工处理中' };
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const EASE = 'cubic-bezier(.2,.8,.2,1)';
const MAX_RUNS = 4;
const BASE = 17 * 3600 + 30 * 60;

let T = 0, paused = false, selected = 'S00059', filter = 'all';
let aiCount = 96, handoffCount = 50, activeRuns = 0, laneSeq = 0;
const byId = new Map(DATA.map(d => [d.id, d]));
const convs = new Map();
const pool = ['S00058', 'S00049', 'S00113', 'S00141', 'S00026'];
const recycled = [];
let events = [];

const pad = n => String(n).padStart(2, '0');
const clock = ms => { const s = BASE + Math.floor(ms / 1000); return pad(Math.floor(s / 3600) % 24) + ':' + pad(Math.floor(s / 60) % 60); };
const dur = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 60) + ':' + pad(s % 60); };
const rnd = (a, b) => a + Math.random() * (b - a);
const esc = s => s.replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const schedule = (delay, fn) => events.push({ at: T + delay, fn });

function makeConv(id, lane, shown, opt = {}) {
  const d = byId.get(id);
  const firstOp = d.msgs.find(m => m.r === 'o');
  const c = {
    id, alias: d.alias, scene: d.scene, product: d.product, high: d.high, msgs: d.msgs, pos: 0, shown: [], lane,
    handler: opt.handler || null, officialHandler: firstOp ? firstOp.by : '欣欣', reason: opt.reason || null, reasonQuote: null,
    waitSince: null, run: null, queued: null, lastRun: null, lastAt: T, fast: !!opt.fast, ending: false, seq: laneSeq++,
  };
  const kind = opt.serviceKind || (lane === 'ai' ? 'a' : 'o');
  let t = T - (opt.ago ?? rnd(60, 300)) * 1000 - Math.max(0, shown - 1) * 55000;
  for (let i = 0; i < shown; i++) {
    const m = c.msgs[c.pos++];
    c.shown.push(m.r === 'c' ? { r: 'c', x: m.x, lv: m.lv, at: t } : { r: kind, x: m.x, by: kind === 'o' ? (c.handler || m.by) : null, at: t });
    t += 55000;
  }
  const last = c.shown[c.shown.length - 1];
  if (last) c.lastAt = last.at;
  if (last && last.r === 'c') c.waitSince = last.at;
  if (lane === 'wait') c.reasonQuote = lastCustomer(c)?.x;
  convs.set(id, c);
  return c;
}
const bands = c => c.shown.filter(s => s.r === 'c').map(s => s.lv);
const curLv = c => { const b = bands(c); return b.length ? b[b.length - 1] : 0; };
const lastCustomer = c => [...c.shown].reverse().find(s => s.r === 'c');
const isRisk = c => c.high.length > 0 || curLv(c) === 2;
const isLate = c => c.waitSince != null && T - c.waitSince >= 120000;

/* ---------- simulation ---------- */
function nextCustomer(c) {
  if (!convs.has(c.id) || c.lane === 'wait' || c.ending) return;
  if (c.pos >= c.msgs.length) return endConv(c);
  const m = c.msgs[c.pos];
  if (m.r !== 'c') return serviceReply(c, c.lane === 'ai' ? 'a' : 'o');
  c.pos++;
  c.shown.push({ r: 'c', x: m.x, lv: m.lv, at: T });
  c.waitSince = T; c.lastAt = T;
  if (c.lane === 'ai') enqueueRun(c, (m.lv === 2 || m.cf || m.med) ? 'handoff' : 'reply');
  else schedule(rnd(3500, 7000), () => serviceReply(c, 'o'));
  render(new Set([c.id]));
}
function serviceReply(c, kind) {
  if (!convs.has(c.id)) return;
  let n = 0;
  while (c.pos < c.msgs.length && c.msgs[c.pos].r === 'o') {
    const m = c.msgs[c.pos++];
    c.shown.push({ r: kind, x: m.x, by: kind === 'o' ? c.handler : null, at: T });
    n++;
  }
  if (!n) return;
  c.waitSince = null; c.lastAt = T;
  render();
  if (c.pos >= c.msgs.length) schedule(rnd(7000, 11000), () => endConv(c));
  else schedule(c.fast ? rnd(5000, 7000) : rnd(6000, 16000), () => nextCustomer(c));
}
function enqueueRun(c, mode) { c.queued = mode; tryRuns(); }
function tryRuns() {
  for (const c of [...convs.values()].filter(x => x.queued && x.lane === 'ai').sort((a, b) => a.waitSince - b.waitSince)) {
    if (activeRuns >= MAX_RUNS) break;
    const mode = c.queued; c.queued = null; activeRuns++;
    const steps = mode === 'handoff' ? [{ n: '安全检查', d: 900, s: 'active' }]
      : STEPS.map(([n, a, b], i) => ({ n, d: rnd(a, b), s: i ? 'pending' : 'active' }));
    c.run = { mode, steps, i: 0, el: 0 };
  }
  render();
}
function tickRuns(dt) {
  for (const c of convs.values()) {
    const r = c.run; if (!r) continue;
    r.el += dt;
    let changed = false;
    while (r.i < r.steps.length && r.el >= r.steps[r.i].d) {
      r.el -= r.steps[r.i].d;
      r.steps[r.i].s = r.mode === 'handoff' ? 'fail' : 'done';
      r.i++; changed = true;
      if (r.i < r.steps.length) r.steps[r.i].s = 'active';
    }
    if (r.i >= r.steps.length) { c.lastRun = r; c.run = null; activeRuns--; r.mode === 'reply' ? serviceReply(c, 'a') : handoff(c); tryRuns(); }
    else if (changed && c.id === selected) renderPreview();
  }
}
function handoff(c) {
  const last = lastCustomer(c);
  const src = c.msgs[c.pos - 1] || {};
  c.lane = 'wait'; c.seq = laneSeq++;
  c.reason = src.med ? '就医 · 安全转人工' : (src.cf || c.high.includes('complaint_risk')) ? '投诉风险' : '情绪激烈';
  c.reasonQuote = last?.x;
  c.shown.push({ r: 'sys', x: '已转人工，客服将继续跟进。', at: T });
  document.getElementById('st-ho').textContent = ++handoffCount;
  render();
  schedule(45000, () => { if (convs.has(c.id) && c.lane === 'wait') takeover(c, c.officialHandler); });
}
function takeover(c, who) {
  if (!convs.has(c.id) || c.lane === 'human') return;
  if (c.run) { c.run = null; activeRuns--; }
  c.queued = null;
  c.lane = 'human'; c.handler = who; c.reason = null; c.seq = laneSeq++;
  c.shown.push({ r: 'sys', x: `${who} 已接管`, at: T });
  if (c.waitSince != null) schedule(rnd(4000, 7000), () => serviceReply(c, 'o'));
  else schedule(rnd(6000, 12000), () => nextCustomer(c));
  tryRuns();
  render();
}
function endConv(c) {
  if (!convs.has(c.id) || c.ending || c.lane === 'wait') return;
  c.ending = true;
  const el = document.querySelector(`.tile[data-id="${c.id}"]`);
  const done = () => {
    convs.delete(c.id); recycled.push(c.id);
    if (selected === c.id) selected = null;
    render();
  };
  if (el && !RM) el.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'scale(.6)' }], { duration: 380, easing: EASE }).onfinish = done;
  else done();
}
function arrive() {
  const id = pool.shift() ?? recycled.shift();
  if (id && !convs.has(id)) {
    const c = makeConv(id, 'ai', 0);
    document.getElementById('st-ai').textContent = ++aiCount;
    nextCustomer(c);
  }
  schedule(rnd(11000, 16000), arrive);
}

/* ---------- rendering ---------- */
function swatch(c, w, h, cut, gap, max) {
  const b = bands(c).slice(-max), n = b.length;
  const inner = h - gap * Math.max(0, n - 1);
  const hs = n <= 1 ? [inner] : [...Array(n - 1).fill(inner * 0.6 / (n - 1)), inner * 0.4];
  return b.map((lv, i) => `<span class="band" style="height:${hs[i].toFixed(1)}px;background:${COL[lv]}"></span>`).join('');
}
function waitMeta(c) {
  const ms = T - c.waitSince;
  return `meta wait${ms >= 120000 ? ' over' : ms >= 60000 ? ' warn' : ''}`;
}
function tileHTML(c) {
  const seq = bands(c).map(lv => LV[lv]).join('、');
  const dim = filter === 'risk' ? !isRisk(c) : filter === 'late' ? !isLate(c) : false;
  const meta = c.waitSince != null
    ? `<span class="${waitMeta(c)}" data-wait="${c.id}">${dur(T - c.waitSince)}</span>`
    : `<span class="meta">${clock(c.lastAt)}</span>`;
  return `<button class="tile${c.id === selected ? ' sel' : ''}${dim ? ' dim' : ''}" data-id="${c.id}"
    aria-label="${esc(c.alias)}，${LANE[c.lane]}，${seq}${isRisk(c) ? '，高风险' : ''}">
    <span class="wave${c.run ? ' on' : ''}" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
    <span class="sw-wrap"><span class="sw">${swatch(c, 32, 54, 7, 1.5, 6)}</span>${isRisk(c) ? '<span class="rdot"></span>' : ''}</span>
    <span class="nm">${esc(c.alias)}</span>${meta}</button>`;
}
const order = {
  wait: (a, b) => a.waitSince - b.waitSince,
  ai: (a, b) => (isRisk(b) - isRisk(a)) || a.seq - b.seq,
  human: (a, b) => a.seq - b.seq,
};
function render(grown = new Set()) {
  const first = new Map();
  document.querySelectorAll('.tile').forEach(el => first.set(el.dataset.id, el.getBoundingClientRect()));
  const focusId = document.activeElement?.classList?.contains('tile') ? document.activeElement.dataset.id : null;
  for (const lane of ['wait', 'ai', 'human']) {
    const list = [...convs.values()].filter(c => c.lane === lane).sort(order[lane]);
    const host = document.querySelector(`.lane[data-lane="${lane}"]`);
    host.querySelector('.tiles').innerHTML = list.map(tileHTML).join('');
    host.querySelector('.n').textContent = list.length;
  }
  if (focusId) document.querySelector(`.tile[data-id="${focusId}"]`)?.focus({ preventScroll: true });
  if (!RM) document.querySelectorAll('.tile').forEach(el => {
    const r0 = first.get(el.dataset.id);
    if (!r0) { el.animate([{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'none' }], { duration: 420, easing: EASE }); return; }
    const r1 = el.getBoundingClientRect(), dx = r0.left - r1.left, dy = r0.top - r1.top;
    if (Math.abs(dx) + Math.abs(dy) > 1) el.animate([{ transform: `translate(${dx}px,${dy}px)` }, { transform: 'none' }], { duration: 560, easing: EASE });
  });
  if (!RM) grown.forEach(id => document.querySelector(`.tile[data-id="${id}"] .band:last-child`)
    ?.animate([{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }], { duration: 420, easing: EASE }));
  renderPreview();
  live();
}
function msgHTML(s, c) {
  if (s.r === 'sys') return `<div class="pm sys"><span>${esc(s.x)}</span></div>`;
  if (s.r === 'c') return `<div class="pm c" style="--lv:${COL[s.lv]}"><div class="who">${esc(c.alias)} <span class="t">${clock(s.at)}</span>
    <span class="e"><i style="background:${COL[s.lv]}"></i>${LV[s.lv]}</span></div><div class="bb">${esc(s.x)}</div></div>`;
  return `<div class="pm s ${s.r}"><div class="who"><span class="t">${clock(s.at)}</span>${s.r === 'a' ? '智能助手' : esc(s.by || '')}</div><div class="bb">${esc(s.x)}</div></div>`;
}
function stepsHTML(r, title) {
  const total = r.mode === 'reply' && r.steps.every(s => s.s === 'done') ? (r.steps.reduce((a, s) => a + s.d, 0) / 1000).toFixed(1) + ' 秒' : '';
  return `<section class="card"><h3>${title}<span class="r">${total}</span></h3>
    <ol class="steps">${r.steps.map((s, i) => `<li class="${s.s}"><span>${s.n}</span><span class="d" ${s.s === 'active' ? 'data-step' : ''}>${
      s.s === 'done' ? (s.d / 1000).toFixed(1) + 's' : s.s === 'fail' ? '转人工' : s.s === 'active' ? (r.el / 1000).toFixed(1) + 's' : ''}</span></li>`).join('')}</ol></section>`;
}
function renderPreview() {
  const host = document.getElementById('preview');
  const c = convs.get(selected);
  if (!c) { host.innerHTML = '<section class="card"><h3>未选择会话</h3></section>'; return; }
  const lv = curLv(c);
  const acts = `<div class="acts">${c.lane !== 'human' ? `<button class="b pri" data-act="take">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>接管</button>` : ''}
    <button class="b" data-act="open">打开会话</button></div>`;
  const head = `<section class="card"><div class="ph">
      <span class="sw-wrap"><span class="sw">${swatch(c, 40, 66, 9, 2, 8)}</span>${isRisk(c) ? '<span class="rdot"></span>' : ''}</span>
      <div><b>${esc(c.alias)}<span class="lane-chip ${c.lane}">${c.lane === 'human' ? '人工 · ' + esc(c.handler) : LANE[c.lane]}</span></b>
        <div class="sub">${esc(c.scene)}${c.product ? ' · ' + esc(c.product) : ''}</div>
        <div class="now"><span><i style="background:${COL[lv]}"></i>${LV[lv]}</span>${c.waitSince != null ? `<span>等待 <span class="t" data-pwait>${dur(T - c.waitSince)}</span></span>` : ''}</div>
      </div></div>${acts}</section>`;
  const reason = c.lane === 'wait' ? `<section class="card"><div class="reason"><b>${c.reason}</b>${c.reasonQuote ? `<q>${esc(c.reasonQuote)}</q>` : ''}</div></section>` : '';
  const run = c.run ? stepsHTML(c.run, 'AI 处理中') : c.queued ? `<section class="card"><h3>AI 排队中</h3></section>` : c.lastRun ? stepsHTML(c.lastRun, '上一轮 AI 处理') : '';
  const msgs = `<section class="card"><h3>最近消息<span class="r">${c.shown.filter(s => s.r === 'c').length} 条消费者消息</span></h3>
    <div class="msgs">${c.shown.slice(-6).map(s => msgHTML(s, c)).join('')}</div></section>`;
  host.innerHTML = head + reason + run + msgs;
}
function live() {
  document.querySelectorAll('[data-wait]').forEach(el => {
    const c = convs.get(el.dataset.wait); if (!c || c.waitSince == null) return;
    el.textContent = dur(T - c.waitSince); el.className = waitMeta(c);
  });
  const sel = convs.get(selected);
  const pw = document.querySelector('[data-pwait]');
  if (pw && sel?.waitSince != null) pw.textContent = dur(T - sel.waitSince);
  const ps = document.querySelector('[data-step]');
  if (ps && sel?.run) ps.textContent = (sel.run.el / 1000).toFixed(1) + 's';
  const all = [...convs.values()];
  const w = all.filter(c => c.lane === 'wait');
  document.querySelector('.lane[data-lane="wait"] .sub').innerHTML = w.length ? `最长等待 <em>${dur(Math.max(...w.map(c => T - c.waitSince)))}</em>` : '';
  const ai = all.filter(c => c.lane === 'ai');
  document.querySelector('.lane[data-lane="ai"] .sub').innerHTML = `处理中 <em>${ai.filter(c => c.run).length}</em>　排队 <em>${ai.filter(c => c.queued).length}</em>`;
  document.getElementById('c-risk').textContent = all.filter(isRisk).length;
  document.getElementById('c-late').textContent = all.filter(isLate).length;
}

/* ---------- interaction ---------- */
document.getElementById('wall').addEventListener('click', e => {
  const t = e.target.closest('.tile'); if (!t) return;
  selected = t.dataset.id;
  document.querySelectorAll('.tile.sel').forEach(x => x.classList.remove('sel'));
  t.classList.add('sel');
  renderPreview();
});
document.getElementById('wall').addEventListener('keydown', e => {
  const t = e.target.closest('.tile'); if (!t) return;
  const tiles = [...document.querySelectorAll('.tile')], i = tiles.indexOf(t);
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); tiles[(i + (e.key === 'ArrowRight' ? 1 : -1) + tiles.length) % tiles.length].focus(); }
  if (e.key.toLowerCase() === 't') { const c = convs.get(t.dataset.id); if (c) { selected = c.id; takeover(c, 'G001'); } }
});
document.getElementById('preview').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const c = convs.get(selected); if (!c) return;
  if (b.dataset.act === 'take') takeover(c, 'G001');
});
document.getElementById('chips').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll('#chips button').forEach(x => x.classList.toggle('on', x === b));
  render();
});
document.getElementById('live').addEventListener('click', e => {
  paused = !paused;
  e.currentTarget.setAttribute('aria-pressed', String(!paused));
  e.currentTarget.querySelector('span').textContent = paused ? '已暂停' : '实时';
});

/* ---------- initial state ---------- */
[['S00059', 2, { fast: true, ago: 70 }], ['S00014', 1, { ago: 5 }], ['S00002', 2], ['S00092', 3], ['S00117', 3], ['S00030', 2], ['S00134', 2],
 ['S00057', 3], ['S00062', 3], ['S00043', 3], ['S00007', 3], ['S00003', 3], ['S00041', 3], ['S00158', 2], ['S00009', 2]]
  .forEach(([id, n, o]) => makeConv(id, 'ai', n, o));
makeConv('S00015', 'wait', 1, { reason: '就医 · 安全转人工', ago: 95 });
makeConv('S00044', 'wait', 4, { reason: '核验未通过', ago: 40, serviceKind: 'a' });
makeConv('S00004', 'human', 2, { handler: '测试客服' });
makeConv('S00076', 'human', 4, { handler: '欣欣' });
makeConv('S00034', 'human', 3, { handler: '薇薇', ago: 20 });
makeConv('S00087', 'human', 4, { handler: '岚岚' });

for (const c of convs.values()) {
  const last = c.shown[c.shown.length - 1];
  if (c.lane === 'wait') schedule(c.id === 'S00015' ? 35000 : 55000, () => { if (c.lane === 'wait') takeover(c, c.officialHandler); });
  else if (c.lane === 'ai' && last.r === 'c') schedule(600, () => enqueueRun(c, 'reply'));
  else if (c.lane === 'human' && last.r === 'c') schedule(rnd(3000, 6000), () => serviceReply(c, 'o'));
  else if (c.id === 'S00059') schedule(1200, () => nextCustomer(c));
  else schedule(rnd(5000, 30000), () => nextCustomer(c));
}
schedule(4000, arrive);
render();

let lastTick = performance.now();
setInterval(() => {
  const now = performance.now(), dt = Math.min(500, now - lastTick); lastTick = now;
  if (paused) return;
  T += dt;
  const due = events.filter(e => e.at <= T);
  events = events.filter(e => e.at > T);
  due.sort((a, b) => a.at - b.at).forEach(e => e.fn());
  tickRuns(dt);
  live();
}, 100);
</script>
